<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">sync-service Cloud Run Architecture</title>
  <desc id="desc">GCP Cloud Run infrastructure diagram for sync-service with ingress, VPC, MongoDB Atlas, secrets, IAM, observability, and CI/CD.</desc>

  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .panel-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .tiny { font: 12px Arial, sans-serif; fill: #64748b; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; rx: 12; }
      .node-blue { fill: #eef6ff; stroke: #4285f4; }
      .node-green { fill: #effaf3; stroke: #34a853; }
      .node-yellow { fill: #fff8e6; stroke: #fbbc04; }
      .node-red { fill: #fff1f1; stroke: #ea4335; }
      .node-purple { fill: #f5f0ff; stroke: #7c3aed; }
      .node-gray { fill: #f8fafc; stroke: #64748b; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .icon-stroke { fill: none; stroke: #0f172a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill-blue { fill: #4285f4; }
      .icon-fill-green { fill: #34a853; }
      .icon-fill-yellow { fill: #fbbc04; }
      .icon-fill-red { fill: #ea4335; }
      .icon-fill-purple { fill: #7c3aed; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <!-- Title -->
  <text x="60" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">sync-service Infrastructure on GCP Cloud Run</text>
  <text x="60" y="82" class="small">Startup-friendly setup: autoscaling, secure private MongoDB access, low operational overhead</text>

  <!-- Left CI/CD panel -->
  <rect class="panel" x="55" y="130" width="270" height="620" filter="url(#shadow)"/>
  <text x="80" y="164" class="panel-title">CI/CD</text>

  <rect class="node node-gray" x="85" y="195" width="210" height="88"/>
  <circle cx="120" cy="230" r="17" class="icon-fill-purple"/>
  <path class="icon-stroke" d="M112 231h16M120 223v16" stroke="#fff"/>
  <text x="150" y="225" class="label">GitHub</text>
  <text x="150" y="247" class="small">PRs and merges</text>

  <rect class="node node-gray" x="85" y="325" width="210" height="96"/>
  <rect x="105" y="350" width="35" height="35" rx="7" fill="#111827"/>
  <path d="M115 367h16M123 359v16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="358" class="label">Jenkins</text>
  <text x="150" y="380" class="small">Build, test, scan</text>
  <text x="150" y="399" class="tiny">Deploy Cloud Run revision</text>

  <rect class="node node-blue" x="85" y="465" width="210" height="96"/>
  <rect x="108" y="493" width="30" height="30" rx="5" class="icon-fill-blue"/>
  <path d="M113 501h20M113 508h20M113 515h20" stroke="#fff" stroke-width="2"/>
  <text x="150" y="498" class="label">Artifact Registry</text>
  <text x="150" y="520" class="small">sync-service images</text>
  <text x="150" y="539" class="tiny">Immutable SHA tags</text>

  <path class="arrow" d="M190 283 L190 322"/>
  <path class="arrow" d="M190 421 L190 462"/>

  <!-- Main GCP panel -->
  <rect class="panel" x="365" y="130" width="650" height="620" filter="url(#shadow)"/>
  <text x="390" y="164" class="panel-title">GCP Runtime</text>

  <!-- Ingress -->
  <rect class="node node-yellow" x="405" y="198" width="240" height="88"/>
  <path class="icon-stroke" d="M430 242c-14 0-22-8-22-18 0-9 7-16 17-17 5-10 15-16 27-14 13 2 22 12 23 25 9 2 15 8 15 17 0 10-8 17-20 17h-40"/>
  <text x="505" y="226" class="label">HTTPS Ingress</text>
  <text x="505" y="248" class="small">Custom domain</text>
  <text x="505" y="267" class="tiny">Optional LB + Cloud Armor</text>

  <!-- Cloud Run -->
  <rect class="node node-blue" x="700" y="198" width="275" height="150"/>
  <rect x="725" y="232" width="52" height="52" rx="10" class="icon-fill-blue"/>
  <path d="M738 250h26M738 260h26M738 270h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="795" y="235" class="label">Cloud Run</text>
  <text x="795" y="258" class="small">sync-service</text>
  <text x="795" y="279" class="tiny">Spring Boot container</text>
  <text x="795" y="301" class="tiny">Autoscale 0 to N instances</text>
  <text x="795" y="322" class="tiny">Revisions for rollback/canary</text>

  <!-- Secret Manager -->
  <rect class="node node-green" x="405" y="394" width="240" height="104"/>
  <rect x="425" y="428" width="42" height="30" rx="6" class="icon-fill-green"/>
  <path d="M433 428v-10c0-9 7-16 16-16s16 7 16 16v10" class="icon-stroke"/>
  <circle cx="446" cy="443" r="4" fill="#fff"/>
  <text x="490" y="428" class="label">Secret Manager</text>
  <text x="490" y="450" class="small">MongoDB creds</text>
  <text x="490" y="469" class="tiny">API keys, env secrets</text>

  <!-- IAM -->
  <rect class="node node-green" x="700" y="394" width="275" height="104"/>
  <circle cx="735" cy="432" r="18" class="icon-fill-green"/>
  <path d="M735 418v16l11 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="770" y="428" class="label">IAM Service Accounts</text>
  <text x="770" y="450" class="small">Least privilege runtime identity</text>
  <text x="770" y="469" class="tiny">No downloaded key files</text>

  <!-- VPC -->
  <rect class="node node-purple" x="405" y="548" width="570" height="150"/>
  <text x="430" y="580" class="label">sync-vpc</text>
  <text x="430" y="602" class="small">Private egress path to MongoDB Atlas</text>

  <rect class="node" x="430" y="625" width="230" height="48"/>
  <text x="455" y="654" class="small">Serverless VPC Access</text>

  <rect class="node" x="715" y="625" width="230" height="48"/>
  <text x="742" y="654" class="small">Private Service Connect</text>

  <!-- Observability panel -->
  <rect class="panel" x="1055" y="130" width="290" height="620" filter="url(#shadow)"/>
  <text x="1080" y="164" class="panel-title">Operations</text>

  <rect class="node node-blue" x="1085" y="198" width="230" height="90"/>
  <path class="icon-stroke" d="M1112 248h44M1112 232h44M1112 216h44"/>
  <text x="1175" y="226" class="label">Cloud Logging</text>
  <text x="1175" y="248" class="small">Structured JSON logs</text>

  <rect class="node node-blue" x="1085" y="333" width="230" height="90"/>
  <path class="icon-stroke" d="M1115 385V354M1115 385h55M1126 375l12-17 13 10 17-28"/>
  <text x="1175" y="361" class="label">Cloud Monitoring</text>
  <text x="1175" y="383" class="small">Latency, errors, scaling</text>

  <rect class="node node-red" x="1085" y="468" width="230" height="90"/>
  <path class="icon-stroke" d="M1130 493l26 45h-52z"/>
  <path d="M1130 507v14M1130 531h.1" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <text x="1175" y="496" class="label">Alerting</text>
  <text x="1175" y="518" class="small">Slack / PagerDuty</text>

  <rect class="node node-purple" x="1085" y="603" width="230" height="90"/>
  <circle cx="1128" cy="641" r="23" class="icon-fill-purple"/>
  <path d="M1118 641h20M1128 631v20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="1175" y="631" class="label">Cloud Trace</text>
  <text x="1175" y="653" class="small">Request correlation</text>

  <!-- Atlas external panel -->
  <rect class="panel" x="565" y="790" width="460" height="80" filter="url(#shadow)"/>
  <ellipse cx="625" cy="829" rx="32" ry="18" class="icon-fill-green"/>
  <path d="M593 829v18c0 10 14 18 32 18s32-8 32-18v-18" fill="#34a853" opacity="0.8"/>
  <text x="685" y="820" class="label">MongoDB Atlas on GCP</text>
  <text x="685" y="843" class="small">Managed replica set, backups, private endpoint, same region</text>

  <!-- User -->
  <rect class="node node-gray" x="55" y="805" width="270" height="65"/>
  <circle cx="95" cy="832" r="18" fill="#64748b"/>
  <circle cx="95" cy="824" r="7" fill="#fff"/>
  <path d="M82 846c4-10 22-10 26 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="130" y="828" class="label">Users / API clients</text>
  <text x="130" y="850" class="small">HTTPS requests</text>

  <!-- Arrows -->
  <path class="arrow" d="M325 837 C370 837 360 242 402 242"/>
  <path class="arrow" d="M645 242 L697 242"/>
  <path class="arrow" d="M295 513 C420 513 585 332 697 290"/>
  <path class="arrow" d="M838 348 L838 391"/>
  <path class="arrow" d="M700 446 L648 446"/>
  <path class="arrow" d="M838 498 C838 540 690 535 690 622"/>
  <path class="arrow" d="M660 649 L712 649"/>
  <path class="arrow" d="M830 673 C830 735 760 773 760 787"/>
  <path class="arrow-dashed" d="M975 270 C1028 270 1028 243 1082 243"/>
  <path class="arrow-dashed" d="M975 300 C1028 300 1028 378 1082 378"/>
  <path class="arrow-dashed" d="M975 318 C1045 318 1035 515 1082 515"/>
  <path class="arrow-dashed" d="M975 336 C1060 336 1030 648 1082 648"/>

  <!-- Footer note -->
  <text x="60" y="885" class="tiny">Diagram: Cloud Run primary architecture for Part 2. GKE Autopilot remains a future option if Kubernetes-specific requirements emerge.</text>
</svg>
